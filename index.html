<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GoalZone — Reservierungsalgorithmus</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FFFFFF;
    --bg-card: #FFFFFF;
    --bg-sec: #F5F5F5;
    --text: #1A1915;
    --text-sec: #6B6960;
    --text-ter: #9B9A94;
    --border: #E8E8E8;
    --border-sec: #D0D0D0;
    --radius-sm: 8px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --green: #1D9E75;
    --green-dark: #0F6E56;
    --green-bg: #E1F5EE;
    --orange: #EF9F27;
    --orange-bg: #FAEEDA;
    --red: #E24B4A;
    --red-bg: #FCEBEB;
    --purple: #7F77DD;
    --purple-bg: #EEEDFE;
    --blue: #378ADD;
    --blue-bg: #E6F1FB;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #FFFFFF;
    color: var(--text);
    min-height: 100vh;
    padding: 2rem;
  }

  .app { max-width: 960px; margin: 0 auto; }

  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 1.5rem; padding-bottom: 1rem;
    border-bottom: 0.5px solid var(--border);
  }
  .header h1 { font-size: 20px; font-weight: 500; margin-bottom: 3px; }
  .header p { font-size: 12px; color: var(--text-ter); }
  .live-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--green); font-weight: 500; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .section-label {
    font-size: 11px; font-weight: 500; color: var(--text-ter);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px;
  }

  .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }

  @media (max-width: 600px) {
    .slot-grid { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr 1fr !important; }
    .summary-row { grid-template-columns: 1fr 1fr !important; }
  }

  .slot-card {
    border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    padding: 1rem 1.1rem; background: var(--bg-card);
    cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
  }
  .slot-card:hover { border-color: var(--border-sec); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .slot-card.selected { border: 2px solid var(--green); }

  .slot-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .slot-name { font-size: 13px; font-weight: 500; }
  .slot-time { font-size: 11px; color: var(--text-ter); margin-top: 2px; }
  .cat-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 500; white-space: nowrap; }

  .bar-track { background: var(--bg-sec); border-radius: 4px; height: 6px; margin: 8px 0 6px; overflow: hidden; }
  .bar-fill { height: 6px; border-radius: 4px; transition: width 0.4s ease; }

  .slot-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sec); }
  .slot-free { font-weight: 500; color: var(--green); }

  .detail-panel {
    border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    padding: 1.25rem; background: var(--bg-card); margin-bottom: 1rem;
  }

  .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }

  .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sum-card { background: var(--bg-sec); border-radius: var(--radius-md); padding: 10px 12px; }
  .sum-label { font-size: 11px; color: var(--text-sec); margin-bottom: 4px; }
  .sum-val { font-size: 22px; font-weight: 500; }

  .list-header {
    display: grid; grid-template-columns: 28px 1fr 80px 90px 130px;
    gap: 10px; padding: 0 10px 8px;
    font-size: 10px; color: var(--text-ter);
    text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 0.5px solid var(--border); margin-bottom: 6px;
  }

  .booking-list { display: flex; flex-direction: column; gap: 5px; max-height: 340px; overflow-y: auto; }
  .booking-row {
    display: grid; grid-template-columns: 28px 1fr 80px 90px 130px;
    gap: 10px; align-items: center; padding: 8px 10px;
    border-radius: var(--radius-md); font-size: 12px;
  }
  .booking-row.noshow  { background: var(--red-bg); }
  .booking-row.attend  { background: var(--green-bg); }
  .booking-row.neutral { background: var(--bg-sec); }

  .booking-name { font-weight: 500; color: var(--text); }
  .booking-meta { color: var(--text-sec); font-size: 11px; margin-top: 1px; }

  .prob-wrap { display: flex; align-items: center; gap: 6px; }
  .prob-track { flex: 1; height: 5px; background: #FFFFFF; border-radius: 3px; overflow: hidden; }
  .prob-fill { height: 5px; border-radius: 3px; }
  .prob-pct { font-size: 11px; font-weight: 500; min-width: 34px; text-align: right; }

  .status-tag { font-size: 10px; padding: 3px 8px; border-radius: 8px; font-weight: 500; text-align: center; white-space: nowrap; }

  .add-panel {
    border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    padding: 1.25rem; background: var(--bg-card);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-field label { font-size: 11px; color: var(--text-sec); }
  .form-field input, .form-field select {
    font-size: 13px; padding: 8px 10px;
    border: 0.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg-sec); color: var(--text);
    outline: none; transition: border-color 0.15s;
  }
  .form-field input:focus, .form-field select:focus { border-color: var(--green); }

  .add-btn {
    font-size: 13px; padding: 9px 22px; border-radius: var(--radius-md);
    border: none; background: var(--green); color: #fff;
    cursor: pointer; font-weight: 500; transition: background 0.15s;
  }
  .add-btn:hover { background: var(--green-dark); }

  .empty { font-size: 13px; color: var(--text-ter); padding: 1.5rem 0; text-align: center; }

  .ai-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 7px 14px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border-sec); background: var(--bg-sec); color: var(--text);
    cursor: pointer; font-weight: 500; transition: background 0.15s;
  }
  .ai-btn:hover { background: var(--purple-bg); border-color: var(--purple); }
  .ai-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .ai-box {
    margin-top: 10px; padding: 10px 14px; border-radius: var(--radius-md);
    background: var(--purple-bg); border: 0.5px solid var(--purple);
    font-size: 12.5px; color: #4B4494; line-height: 1.5;
  }
  .ai-box.loading { color: var(--text-ter); background: var(--bg-sec); border-color: var(--border); font-style: italic; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div>
      <h1>GoalZone — Reservierungsalgorithmus</h1>
      <p>No-Show-Wahrscheinlichkeit pro Buchung · Echtzeit-Kapazitätsschätzung</p>
    </div>
    <div class="live-badge"><div class="live-dot"></div>Live</div>
  </div>

  <p class="section-label">Heutige Zeitslots</p>
  <div class="slot-grid" id="slotGrid"></div>

  <div class="detail-panel">
    <div class="detail-header">
      <p class="section-label" style="margin:0" id="detailTitle">Zeitslot wählen</p>
      <div class="summary-row" id="summaryRow"></div>
    </div>
    <div id="aiInsightWrap" style="margin-bottom:14px;"></div>
    <div class="list-header">
      <span>#</span><span>Mitglied</span><span>Monate</span><span>No-Show %</span><span>Status</span>
    </div>
    <div class="booking-list" id="bookingList">
      <p class="empty">Klicke auf einen Zeitslot um die Buchungen zu sehen.</p>
    </div>
  </div>

  <div class="add-panel">
    <p class="section-label">Neue Buchung hinzufügen</p>
    <div class="form-grid">
      <div class="form-field">
        <label>Zeitslot</label>
        <select id="fSlot"></select>
      </div>
      <div class="form-field">
        <label>Mitgliedschaft (Monate)</label>
        <input type="number" id="fMonths" min="1" max="100" value="8"/>
      </div>
      <div class="form-field">
        <label>Gewicht (kg)</label>
        <input type="number" id="fWeight" min="40" max="150" value="82" step="0.1"/>
      </div>
      <div class="form-field">
        <label>Tage vor Kurs</label>
        <input type="number" id="fDays" min="1" max="14" value="7"/>
      </div>
      <div class="form-field">
        <label>Name</label>
        <input type="text" id="fName" value="Neues Mitglied"/>
      </div>
      <div class="form-field" style="justify-content:flex-end">
        <button class="add-btn" onclick="addBooking()">+ Buchung hinzufügen</button>
      </div>
    </div>
  </div>

</div>

<script>
// ── Modell (Logistic Regression, trainiert auf fitness_class_2212.csv) ──
const INTERCEPT = -1.620391;
const COEF      = [0.120168, -0.009864, -0.16255, 0.355457, -0.215255, -0.048798];
// Features: months, weight, days_before, day_of_week(0=Mo..6=So), time_PM(0/1), category(HIIT=0,Cycling=1,Strength=2,Yoga=3,Aqua=4)

const DAY_MAP = {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
const CAT_MAP = {HIIT:0,Cycling:1,Strength:2,Yoga:3,Aqua:4};
const CAT_COLORS = {
  HIIT:    ['#EEEDFE','#7F77DD'],
  Cycling: ['#E1F5EE','#0F6E56'],
  Strength:['#E6F1FB','#185FA5'],
  Yoga:    ['#FAEEDA','#854F0B'],
  Aqua:    ['#FAECE7','#993C1D'],
};
const DAYS  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TODAY = DAYS[new Date().getDay() === 0 ? 6 : new Date().getDay() - 1];
const NAMES = ['Maria K.','Jonas H.','Sara M.','Tobias L.','Anna W.','Felix B.',
               'Laura S.','Max R.','Julia T.','David P.','Sophie N.','Lukas E.',
               'Emma F.','Paul G.','Mia Z.','Tim A.','Nina C.','Ben D.','Clara I.','Nico J.'];

function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }

function predictNoShow(months, weight, daysBefore, day, isPM, category) {
  const x = [months, weight, daysBefore, DAY_MAP[day] ?? 0, isPM ? 1 : 0, CAT_MAP[category] ?? 0];
  const z = INTERCEPT + COEF.reduce((s, c, i) => s + c * x[i], 0);
  return 1 - sigmoid(z);
}

// ── Zeitslots ──
const slots = [
  { id:'s1', name:'HIIT Power',    day:TODAY, time:'07:00', period:'AM', category:'HIIT',     capacity:15 },
  { id:'s2', name:'Yoga Flow',     day:TODAY, time:'09:00', period:'AM', category:'Yoga',     capacity:12 },
  { id:'s3', name:'Cycling Sprint',day:TODAY, time:'10:30', period:'AM', category:'Cycling',  capacity:20 },
  { id:'s4', name:'Aqua Fit',      day:TODAY, time:'12:00', period:'AM', category:'Aqua',     capacity:18 },
  { id:'s5', name:'Strength Pro',  day:TODAY, time:'17:00', period:'PM', category:'Strength', capacity:16 },
  { id:'s6', name:'HIIT Evening',  day:TODAY, time:'19:00', period:'PM', category:'HIIT',     capacity:20 },
];

function genBookings(slot) {
  const n = Math.min(Math.floor(slot.capacity * (0.85 + Math.random() * 0.2)), slot.capacity);
  return Array.from({ length: n }, (_, i) => {
    const months    = Math.round(Math.random() * 40 + 1);
    const weight    = Math.round((60 + Math.random() * 50) * 10) / 10;
    const daysBefore= Math.floor(Math.random() * 13) + 1;
    const noshow    = predictNoShow(months, weight, daysBefore, slot.day, slot.period === 'PM', slot.category);
    return { name: NAMES[i % NAMES.length], months, weight, daysBefore, noshow: Math.round(noshow * 1000) / 10 };
  });
}

const bookings = {};
slots.forEach(s => bookings[s.id] = genBookings(s));

let selectedSlot = null;

// ── Hilfsfunktionen ──
function getStats(slot) {
  const bs = bookings[slot.id] || [];
  const expectedNoShows = bs.reduce((s, b) => s + b.noshow / 100, 0);
  return {
    occupied: bs.length,
    freeReal: slot.capacity - bs.length,
    freeEst:  Math.round((slot.capacity - bs.length) + expectedNoShows),
    expNS:    Math.round(expectedNoShows * 10) / 10,
  };
}

function barColor(pct) {
  if (pct > 0.85) return '#E24B4A';
  if (pct > 0.60) return '#EF9F27';
  return '#1D9E75';
}

// ── Render Slots ──
function renderSlots() {
  document.getElementById('slotGrid').innerHTML = slots.map(s => {
    const { occupied, freeEst } = getStats(s);
    const pct = occupied / s.capacity;
    const [bg, fg] = CAT_COLORS[s.category];
    return `
      <div class="slot-card${selectedSlot === s.id ? ' selected' : ''}" onclick="selectSlot('${s.id}')">
        <div class="slot-top">
          <div>
            <div class="slot-name">${s.name}</div>
            <div class="slot-time">${s.time} · ${s.day}</div>
          </div>
          <span class="cat-badge" style="background:${bg};color:${fg}">${s.category}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${Math.min(pct,1)*100}%;background:${barColor(pct)}"></div>
        </div>
        <div class="slot-stats">
          <span>${occupied}/${s.capacity} gebucht</span>
          <span class="slot-free">~${freeEst} frei</span>
        </div>
      </div>`;
  }).join('');

  // Slot-Auswahl im Formular
  const sel = document.getElementById('fSlot');
  const cur = sel.value;
  sel.innerHTML = slots.map(s => `<option value="${s.id}">${s.name} (${s.time})</option>`).join('');
  if (cur) sel.value = cur;
}

// ── Render Detail ──
function renderDetail(slotId) {
  const slot = slots.find(s => s.id === slotId);
  if (!slot) return;

  const { occupied, freeEst, expNS } = getStats(slot);
  document.getElementById('detailTitle').textContent =
    `${slot.name} · ${slot.time} ${slot.period} · ${slot.day}`;

  document.getElementById('summaryRow').innerHTML = `
    <div class="sum-card"><div class="sum-label">Kapazität</div><div class="sum-val">${slot.capacity}</div></div>
    <div class="sum-card"><div class="sum-label">Gebucht</div><div class="sum-val">${occupied}</div></div>
    <div class="sum-card"><div class="sum-label">Erw. No-Shows</div><div class="sum-val" style="color:#EF9F27">${expNS}</div></div>
    <div class="sum-card"><div class="sum-label">Geschätzt frei</div><div class="sum-val" style="color:#1D9E75">~${freeEst}</div></div>
  `;

  const sorted = [...(bookings[slotId] || [])].sort((a, b) => b.noshow - a.noshow);
  document.getElementById('bookingList').innerHTML = sorted.length === 0
    ? '<p class="empty">Noch keine Buchungen.</p>'
    : sorted.map((b, i) => {
        const isHigh = b.noshow >= 65;
        const isLow  = b.noshow < 35;
        const rowCls = isHigh ? 'noshow' : isLow ? 'attend' : 'neutral';
        const probColor = isHigh ? '#E24B4A' : isLow ? '#1D9E75' : '#EF9F27';
        const tagBg  = isHigh ? 'var(--red-bg)'   : isLow ? 'var(--green-bg)' : 'var(--orange-bg)';
        const tagFg  = isHigh ? '#A32D2D' : isLow ? '#0F6E56' : '#854F0B';
        const tagTxt = isHigh ? 'No-Show wahrsch.' : isLow ? 'Erscheint wahrsch.' : 'Ungewiss';
        return `
          <div class="booking-row ${rowCls}">
            <span style="font-size:10px;color:var(--text-ter);text-align:center">${i+1}</span>
            <div>
              <div class="booking-name">${b.name}</div>
              <div class="booking-meta">${b.months} Mo. · ${b.weight} kg · ${b.daysBefore}d vorher</div>
            </div>
            <span style="font-size:12px;color:var(--text-sec)">${b.months} Mo.</span>
            <div class="prob-wrap">
              <div class="prob-track"><div class="prob-fill" style="width:${b.noshow}%;background:${probColor}"></div></div>
              <span class="prob-pct" style="color:${probColor}">${b.noshow}%</span>
            </div>
            <span class="status-tag" style="background:${tagBg};color:${tagFg}">${tagTxt}</span>
          </div>`;
      }).join('');
}

function selectSlot(id) {
  selectedSlot = id;
  renderSlots();
  renderDetail(id);
  renderAiInsightBox(id);
}

// ── KI-Einschätzung pro Zeitslot (Anthropic API) ──
// Hinweis: Dieser Aufruf funktioniert nur innerhalb der Claude.ai-Artefakt-Umgebung.
// Bei eigenständigem Hosting (z. B. GitHub Pages) greift automatisch der lokale
// Fallback-Text unten — die Kernfunktion der App bleibt davon unberührt.
const ANTHROPIC_ENDPOINT = "https://api.anthropic.com/v1/messages"; // in Produktion durch eigenen Backend-Endpunkt ersetzen
const aiCache = {};

function renderAiInsightBox(slotId) {
  const wrap = document.getElementById('aiInsightWrap');
  if (aiCache[slotId]) {
    wrap.innerHTML = `<div class="ai-box">🤖 ${aiCache[slotId]}</div>`;
    return;
  }
  wrap.innerHTML = `<button class="ai-btn" id="aiBtn" onclick="requestAiInsight('${slotId}')">🤖 KI-Einschätzung für diesen Slot abrufen</button>`;
}

async function requestAiInsight(slotId) {
  const slot = slots.find(s => s.id === slotId);
  const { occupied, freeEst, expNS } = getStats(slot);
  const wrap = document.getElementById('aiInsightWrap');
  wrap.innerHTML = `<div class="ai-box loading">KI-Einschätzung wird geladen …</div>`;

  const highRisk = (bookings[slotId] || []).filter(b => b.noshow >= 65).length;

  try {
    const prompt = `Ein Fitnessstudio-Kursslot "${slot.name}" (${slot.category}, ${slot.time} ${slot.day}) hat ${occupied} von ${slot.capacity} Plätzen gebucht.
Erwartete No-Shows: ${expNS}. Geschätzt frei durch Overbooking: ${freeEst}. Davon ${highRisk} Buchungen mit hohem No-Show-Risiko (≥65%).
Formuliere GENAU ZWEI kurze Sätze auf Deutsch als Handlungsempfehlung fürs Studio-Personal: ob und wie viele Zusatzplätze angeboten werden sollten und worauf zu achten ist. Kein Vorspann, keine Anführungszeichen.`;

    const response = await fetch(ANTHROPIC_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if (!response.ok) throw new Error("API nicht erreichbar (erwartet außerhalb von Claude.ai)");
    const data = await response.json();
    const textBlock = (data.content || []).find(c => c.type === 'text');
    aiCache[slotId] = textBlock ? textBlock.text.trim() : 'Keine Einschätzung verfügbar.';
  } catch (err) {
    // Lokaler Fallback, greift z. B. auf GitHub Pages ohne eigenes Backend
    aiCache[slotId] = freeEst > 0
      ? `Etwa ${freeEst} Zusatzplätze erscheinen auf Basis der Modellprognose vertretbar. Bei ${highRisk} Hochrisiko-Buchungen empfiehlt sich eine kurze Erinnerung vor Kursbeginn. (Demo-Fallback, kein API-Backend verbunden)`
      : `Aktuell kein sicherer Spielraum für Zusatzplätze erkennbar — Kapazität ist bereits knapp ausgelastet. (Demo-Fallback, kein API-Backend verbunden)`;
  }
  renderAiInsightBox(slotId);
}

function addBooking() {
  const slotId    = document.getElementById('fSlot').value;
  const slot      = slots.find(s => s.id === slotId);
  const months    = parseInt(document.getElementById('fMonths').value)  || 8;
  const weight    = parseFloat(document.getElementById('fWeight').value) || 80;
  const daysBefore= parseInt(document.getElementById('fDays').value)    || 7;
  const name      = document.getElementById('fName').value.trim()       || 'Mitglied';

  if (bookings[slotId].length >= slot.capacity + 5) {
    alert('Maximale Buchungsanzahl erreicht für diesen Slot.');
    return;
  }

  const noshow = predictNoShow(months, weight, daysBefore, slot.day, slot.period === 'PM', slot.category);
  bookings[slotId].push({ name, months, weight, daysBefore, noshow: Math.round(noshow * 1000) / 10 });

  document.getElementById('fName').value = NAMES[Math.floor(Math.random() * NAMES.length)];
  selectSlot(slotId);
}

// Init
renderSlots();
selectSlot('s1');
</script>
</body>
</html>
